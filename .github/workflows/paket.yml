name: Gesamtpaket

# Baut das ZIP mit Startseite, allen drei Programmen, README als Seite, Lizenz und
# LIESMICH und hängt es an die laufenden Releases. Läuft nach jeder Änderung an den
# ausgelieferten Dateien, bei jeder Veröffentlichung und von Hand.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'hangar/**'
      - 'tuner/**'
      - 'guide/**'
      - 'README.md'
      - 'LICENSE'
      - 'tools/**'
      - '.github/workflows/paket.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paket
  cancel-in-progress: false

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ZIP bauen
        run: node tools/paket.mjs

      - name: ZIP an die Releases hängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEU: ${{ github.event.release.tag_name }}
        run: |
          set -e
          if [ -n "$NEU" ]; then
            gh release upload "$NEU" paket/FlowState-FPV-mit-Hub.zip --clobber
            exit 0
          fi
          gh release list --limit 20 --json tagName --jq '.[].tagName' | while read -r tag; do
            echo "Release $tag"
            gh release upload "$tag" paket/FlowState-FPV-mit-Hub.zip --clobber || true
          done
