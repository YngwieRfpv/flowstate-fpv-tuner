name: Drive-Import

# Einmaliger Import: holt die beiden HTML-Staende aus dem oeffentlichen
# Drive-Ordner "GitHub Versionen" und legt sie in den Branch.
# Laeuft nur von Hand oder wenn diese Datei selbst geaendert wird.

on:
  workflow_dispatch:
  push:
    branches: [arena/97255d76-flowstate-fpv-tuner]
    paths:
      - '.github/workflows/drive-import.yml'

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/97255d76-flowstate-fpv-tuner

      - name: Dateien aus Drive laden
        run: |
          set -euo pipefail
          mkdir -p /tmp/drive
          hole () {
            id="$1"; ziel="$2"
            curl -sSL --fail --retry 3 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "$ziel"
            echo "--- $ziel"
            ls -l "$ziel"
            head -c 120 "$ziel"; echo
            grep -qi "<!doctype html\|<html" "$ziel" || { echo "kein HTML"; exit 1; }
          }
          hole "1gB7pdxi1HlgMI7n8nwdy0trWBfeHbCU-" /tmp/drive/hangar.html
          hole "1zePiWi2YasJ0THN1iiqpfbJYCuXf9_sA" /tmp/drive/guide.html

      - name: Groesse und Pruefsumme
        run: |
          sha256sum /tmp/drive/hangar.html /tmp/drive/guide.html
          wc -c /tmp/drive/hangar.html /tmp/drive/guide.html

      - name: In den Branch legen
        run: |
          set -euo pipefail
          cp /tmp/drive/hangar.html hangar/index.html
          cp /tmp/drive/guide.html guide/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hangar/index.html guide/index.html
          git commit -m "Drive-Import: Hangar 0.9.2-beta.1 und Guide 1.0.1-beta.19 uebernommen" || echo "keine Aenderung"
          git push
