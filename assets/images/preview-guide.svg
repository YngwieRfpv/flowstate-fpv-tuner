<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Ansicht des FPV Guide: Seitenleiste mit acht Bereichen und Workflow, Topbar, Profilzeile und Kapitel Schritt 01 ESC vorbereiten">
  <defs>
    <linearGradient id="gsb" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#091a2e"/>
      <stop offset="1" stop-color="#05111f"/>
    </linearGradient>
    <linearGradient id="gtop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112643"/>
      <stop offset="1" stop-color="#09182a"/>
    </linearGradient>
    <linearGradient id="gnav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#124c73"/>
      <stop offset="1" stop-color="#0f3656"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="#07111f"/>

  <!-- Seitenleiste -->
  <g>
    <rect width="260" height="760" fill="url(#gsb)"/>
    <path d="M260 0v760" stroke="#2d4a70" stroke-width="1" stroke-opacity="0.8"/>

    <text x="24" y="50" fill="#f1f8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.6">BF</text>
    <text x="24" y="74" fill="#cfe2f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="600">Tuning Guide</text>
    <rect x="24" y="86" width="82" height="20" rx="10" fill="#50e3a4" fill-opacity="0.13" stroke="#50e3a4" stroke-opacity="0.42"/>
    <text x="65" y="100" fill="#50e3a4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">GitHub Beta</text>
    <text x="24" y="126" fill="#5e748e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9">v1.0.1-beta.1 · 24.10.2026</text>

    <!-- Bereiche -->
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">
      <text x="30" y="164" fill="#a9bad0">Startseite</text>
      <rect x="16" y="176" width="228" height="28" rx="8" fill="url(#gnav)" stroke="#39bdf8"/>
      <rect x="16" y="176" width="3" height="28" rx="1.5" fill="#23d3d3"/>
      <text x="32" y="195" fill="#ecfaff" font-weight="600">Simple Tuning</text>
      <text x="30" y="227" fill="#a9bad0">Advanced Tuning</text>
      <text x="30" y="259" fill="#a9bad0">Technik &amp; Referenz</text>
      <text x="30" y="291" fill="#a9bad0">Build-Guide</text>
      <text x="30" y="323" fill="#a9bad0">Glossar</text>
      <text x="30" y="355" fill="#a9bad0">Quellen &amp; Shoutouts</text>
      <text x="30" y="387" fill="#a9bad0">Links</text>
    </g>

    <path d="M16 406h228" stroke="#34435b" stroke-width="1"/>

    <!-- Workflow -->
    <text x="24" y="426" fill="#5e748e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" letter-spacing="1.3">DEIN WORKFLOW</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">
      <text x="24" y="449" fill="#5e748e" font-size="8.5" font-family="ui-monospace, Menlo, Consolas, monospace">00</text>
      <text x="48" y="449" fill="#a9bad0">Copter einrichten</text>

      <rect x="16" y="457" width="228" height="22" rx="6" fill="#23d3d3" fill-opacity="0.10" stroke="#23d3d3" stroke-opacity="0.35"/>
      <text x="24" y="472" fill="#23d3d3" font-size="8.5" font-family="ui-monospace, Menlo, Consolas, monospace">01</text>
      <text x="48" y="472" fill="#ecf6ff">ESC</text>

      <text x="24" y="497" fill="#5e748e" font-size="8.5" font-family="ui-monospace, Menlo, Consolas, monospace">02</text>
      <text x="48" y="497" fill="#a9bad0">Betaflight-Basis</text>
      <text x="24" y="521" fill="#5e748e" font-size="8.5" font-family="ui-monospace, Menlo, Consolas, monospace">03</text>
      <text x="48" y="521" fill="#a9bad0">Filterflug &amp; Filter</text>
      <text x="24" y="545" fill="#5e748e" font-size="8.5" font-family="ui-monospace, Menlo, Consolas, monospace">04</text>
      <text x="48" y="545" fill="#a9bad0">PID &amp; Feedforward</text>
      <text x="24" y="569" fill="#5e748e" font-size="8.5" font-family="ui-monospace, Menlo, Consolas, monospace">05</text>
      <text x="48" y="569" fill="#a9bad0">Abschlussprüfung</text>
    </g>

    <!-- Fortschritt -->
    <text x="24" y="700" fill="#8aa2bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">Eine Änderung. Ein Vergleich.</text>
    <rect x="24" y="712" width="196" height="5" rx="2.5" fill="#17304a"/>
    <rect x="24" y="712" width="42" height="5" rx="2.5" fill="#50e3a4"/>
    <text x="244" y="718" fill="#5e748e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="end">1 / 6</text>
  </g>

  <!-- Topbar -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="278" y="10" width="904" height="60" rx="16" fill="url(#gtop)" stroke="#2f5583"/>
    <path d="M300 39l-6 -5v10z" fill="#8aa2bd"/>
    <text x="310" y="43" fill="#d3e6f7" font-size="11">Datei &amp; Logs</text>

    <g>
      <rect x="698" y="24" width="108" height="32" rx="8" fill="#0e1b2e" fill-opacity="0.75" stroke="#2a4568"/>
      <text x="708" y="35" fill="#5e748e" font-size="7" letter-spacing="0.9">MODUS</text>
      <text x="708" y="48" fill="#ecf6ff" font-size="10.5">Geführt</text>

      <rect x="814" y="24" width="116" height="32" rx="8" fill="#50e3a4" fill-opacity="0.08" stroke="#50e3a4" stroke-opacity="0.32"/>
      <circle cx="826" cy="40" r="3" fill="#50e3a4"/>
      <text x="834" y="43" fill="#bfeeda" font-size="10">Lokal &amp; offline</text>

      <rect x="938" y="24" width="104" height="32" rx="8" fill="#0e1b2e" fill-opacity="0.75" stroke="#2a4568"/>
      <text x="948" y="35" fill="#5e748e" font-size="7" letter-spacing="0.9">SPRACHE</text>
      <text x="948" y="48" fill="#ecf6ff" font-size="10.5">Deutsch</text>

      <rect x="1050" y="24" width="114" height="32" rx="8" fill="#0e1b2e" fill-opacity="0.75" stroke="#2a4568"/>
      <text x="1060" y="35" fill="#5e748e" font-size="7" letter-spacing="0.9">DARSTELLUNG</text>
      <text x="1060" y="48" fill="#ecf6ff" font-size="10.5">Dunkel</text>
    </g>
  </g>

  <!-- Profilzeile -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="278" y="82" width="904" height="36" rx="12" fill="#111d30" stroke="#223653"/>
    <text x="298" y="105" fill="#d3e6f7" font-size="11">5 Zoll (4–6) · Offen · BF 4.3–4.4 · Bluejay</text>
    <rect x="1050" y="88" width="112" height="24" rx="12" fill="#0e1b2e" stroke="#2d4a70"/>
    <text x="1106" y="104" fill="#a9bad0" font-size="9.5" text-anchor="middle">Profil ändern</text>
  </g>

  <!-- Kapitel -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="278" y="130" width="592" height="610" rx="12" fill="#111d30" stroke="#223653"/>

    <text x="298" y="152" fill="#5e748e" font-size="9">← Zurück: Startseite</text>
    <text x="850" y="152" fill="#5e748e" font-size="9" text-anchor="end">Vor →</text>
    <text x="298" y="176" fill="#50e3a4" font-size="8.5" letter-spacing="1.2" font-weight="700">SCHRITT 01 / 5</text>
    <text x="298" y="206" fill="#ecf6ff" font-size="20" font-weight="700">ESC vorbereiten</text>
    <text x="298" y="230" fill="#a9bad0" font-size="10">Passendes ESC-Target und bewährte Antriebseinstellungen prüfen.</text>
    <text x="298" y="246" fill="#a9bad0" font-size="10">Während der Tuning-Vergleiche unverändert lassen.</text>

    <rect x="298" y="264" width="552" height="92" rx="10" fill="#16233a" stroke="#223653"/>
    <text x="314" y="286" fill="#ecf6ff" font-size="11.5" font-weight="600">Wo stelle ich das ein?</text>
    <g font-size="9.5" fill="#a9bad0">
      <text x="314" y="306">ESC-Tool für Firmware und ESC-Felder, danach Betaflight für Protokoll,</text>
      <text x="314" y="322">Polzahl und Drehrichtung. Der Pfad zeigt nur, wo ein Feld liegt –</text>
      <text x="314" y="338">nicht, dass der Beispielwert zu jedem Copter passt.</text>
    </g>

    <text x="298" y="384" fill="#ecf6ff" font-size="12" font-weight="600">1 · ESC-Firmware prüfen und bei Bedarf flashen</text>
    <text x="298" y="404" fill="#a9bad0" font-size="9.5">ESC Configurator → Connect → Read → Werte sichern</text>
    <text x="298" y="420" fill="#a9bad0" font-size="9.5">nur bei Bedarf Write → danach erneut Read</text>

    <text x="298" y="452" fill="#ecf6ff" font-size="12" font-weight="600">2 · ESC einstellen</text>
    <text x="298" y="472" fill="#d3e6f7" font-size="10">Timing und Motoranlauf</text>
    <text x="298" y="488" fill="#a9bad0" font-size="9.5">Nach dem PWM-Wert nur noch die folgenden Felder anfassen.</text>

    <rect x="298" y="506" width="552" height="54" rx="8" fill="#1f6697" fill-opacity="0.15"/>
    <rect x="298" y="506" width="3" height="54" rx="1.5" fill="#23d3d3"/>
    <text x="316" y="528" fill="#c0e4f7" font-size="9.5">Motor-Test in der Betaflight-App nur mit abgenommenen Props.</text>
    <text x="316" y="546" fill="#c0e4f7" font-size="9.5">Der Pfad zeigt, wo ein Feld liegt – nicht den passenden Wert.</text>

    <text x="298" y="596" fill="#5e748e" font-size="8" letter-spacing="1.2" font-weight="700">WAS?</text>
    <text x="520" y="596" fill="#5e748e" font-size="8" letter-spacing="1.2" font-weight="700">EINSTELLUNGSWEG</text>
    <path d="M298 606h552" stroke="#223653"/>
    <text x="298" y="628" fill="#d3e6f7" font-size="9.5">ESC-Firmware, Target, PWM</text>
    <text x="520" y="628" fill="#a9bad0" font-size="9.5">ESC Configurator → Connect → Read</text>
    <path d="M298 640h552" stroke="#223653"/>
    <text x="298" y="662" fill="#d3e6f7" font-size="9.5">DShot, Polzahl, Drehrichtung</text>
    <text x="520" y="662" fill="#a9bad0" font-size="9.5">Betaflight App → Motors</text>
    <path d="M298 674h552" stroke="#223653"/>

    <rect x="298" y="690" width="120" height="30" rx="8" fill="#0e1b2e" stroke="#2d4a70"/>
    <text x="358" y="709" fill="#a9bad0" font-size="10" text-anchor="middle">← Zurück</text>
    <rect x="730" y="690" width="120" height="30" rx="8" fill="#50e3a4"/>
    <text x="790" y="709" fill="#04241a" font-size="10" font-weight="700" text-anchor="middle">Weiter →</text>
  </g>

  <!-- Seitenspalte -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="886" y="130" width="296" height="222" rx="12" fill="#111d30" stroke="#223653"/>
    <text x="902" y="154" fill="#ecf6ff" font-size="12" font-weight="600">Bereit für den nächsten Schritt?</text>
    <g>
      <rect x="902" y="167" width="11" height="11" rx="3" fill="none" stroke="#2d4a70"/>
      <text x="921" y="177" fill="#a9bad0" font-size="9">Propeller entfernt, Einstellungen gesichert</text>
      <rect x="902" y="193" width="11" height="11" rx="3" fill="none" stroke="#2d4a70"/>
      <text x="921" y="203" fill="#a9bad0" font-size="9">ESC-Target und passende Firmware geprüft</text>
      <rect x="902" y="219" width="11" height="11" rx="3" fill="none" stroke="#2d4a70"/>
      <text x="921" y="229" fill="#a9bad0" font-size="9">Werte geschrieben und von allen 4 ESCs gelesen</text>
      <rect x="902" y="245" width="11" height="11" rx="3" fill="none" stroke="#2d4a70"/>
      <text x="921" y="255" fill="#a9bad0" font-size="9">Alle Motoren starten und drehen richtig</text>
    </g>
    <text x="902" y="286" fill="#5e748e" font-size="8.5">Noch 4 Punkte abhaken</text>
    <rect x="902" y="298" width="264" height="28" rx="6" fill="#0e1b2e" stroke="#2d4a70"/>
    <text x="1034" y="316" fill="#a9bad0" font-size="9" text-anchor="middle">Profil-Checklisten zurücksetzen</text>

    <rect x="886" y="368" width="296" height="212" rx="12" fill="#111d30" stroke="#223653"/>
    <text x="902" y="392" fill="#ecf6ff" font-size="12" font-weight="600">Filter-Workspace</text>
    <g font-size="9" fill="#a9bad0">
      <text x="902" y="414">Blackbox-Tuning-Ansichten</text>
      <text x="902" y="432">6 Ansichten: Rohgyro; gefiltertes Gyro + D;</text>
      <text x="902" y="448">Roll, Pitch und Yaw mit Setpoint/Gyro und</text>
      <text x="902" y="464">PID/FF; Motoren und Gas.</text>
      <text x="902" y="486" fill="#8aa2bd">Passend: BF 4.3–4.4</text>
    </g>
    <rect x="902" y="500" width="264" height="30" rx="8" fill="#50e3a4"/>
    <text x="1034" y="520" fill="#04241a" font-size="9.5" font-weight="700" text-anchor="middle">Workspace herunterladen</text>
    <text x="902" y="552" fill="#5e748e" font-size="8.5">Andere Variante: BF 4.5–2026.6</text>

    <rect x="886" y="596" width="296" height="144" rx="12" fill="#111d30" stroke="#223653"/>
    <text x="902" y="620" fill="#ecf6ff" font-size="12" font-weight="600">Begriffe &amp; Hilfe</text>
    <g font-size="9" fill="#a9bad0">
      <text x="902" y="642">Unterstrichene Fachwörter öffnen die Erklärung</text>
      <text x="902" y="658">direkt im Guide. 95 Begriffe im Glossar.</text>
    </g>
    <rect x="902" y="678" width="264" height="26" rx="8" fill="#0e1b2e" stroke="#2d4a70"/>
    <text x="1034" y="695" fill="#a9bad0" font-size="9" text-anchor="middle">Glossar öffnen</text>
  </g>
</svg>
