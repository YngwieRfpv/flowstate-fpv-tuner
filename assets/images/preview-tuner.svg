<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Ansicht des FlowState Tuner: Phasenleiste, Prüf-Gates, Gyro-Spektrum, Filter-Slider und CLI-Plan">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#091524"/>
      <stop offset="1" stop-color="#06101c"/>
    </linearGradient>
    <linearGradient id="tcard" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#112136"/>
      <stop offset="1" stop-color="#0a192b"/>
    </linearGradient>
    <linearGradient id="tcurve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37bdf8"/>
      <stop offset="1" stop-color="#23d3d3"/>
    </linearGradient>
    <linearGradient id="tfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37bdf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#37bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37bdf8"/>
      <stop offset="1" stop-color="#23d3d3"/>
    </linearGradient>
    <linearGradient id="tactive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#124c73"/>
      <stop offset="1" stop-color="#0f3656"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#tbg)"/>

  <!-- Kopfzeile -->
  <g>
    <path d="M0 64h1200" stroke="#223653" stroke-width="1"/>
    <g fill="none" stroke="url(#tmark)" stroke-width="2" stroke-linecap="round">
      <circle cx="36" cy="26" r="4.4" opacity="0.55"/>
      <circle cx="52" cy="26" r="4.4"/>
      <circle cx="36" cy="42" r="4.4"/>
      <circle cx="52" cy="42" r="4.4" opacity="0.55"/>
      <path d="M39.6 29.6 48.4 38.4M48.4 29.6 39.6 38.4"/>
    </g>
    <circle cx="44" cy="34" r="2.2" fill="url(#tmark)"/>
    <text x="70" y="40" fill="#ecf6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">FlowState Tuner</text>
    <text x="258" y="40" fill="#8aa2bd" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">v4.8-alpha.1</text>

    <rect x="698" y="17" width="82" height="30" rx="9" fill="#0e1b2e" stroke="#223653"/>
    <text x="710" y="37" fill="#8aa2bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">kein Log</text>
    <rect x="790" y="17" width="100" height="30" rx="9" fill="#0e1b2e" stroke="#223653"/>
    <text x="802" y="37" fill="#a9bad0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">Zielprofil 2</text>
    <rect x="900" y="17" width="148" height="30" rx="9" fill="#0e1b2e" stroke="#2d4a70"/>
    <circle cx="918" cy="32" r="4" fill="#50e3a4"/>
    <text x="930" y="37" fill="#d3e6f7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">verbunden</text>
    <rect x="1062" y="17" width="114" height="30" rx="9" fill="#37bdf8"/>
    <text x="1119" y="37" fill="#04121f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Verbinden</text>

    <text x="24" y="88" fill="#5e748e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">FC: BMI270 · 8 kHz Loop · DSHOT600</text>
    <text x="1176" y="88" fill="#5e748e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" text-anchor="end">lokal · offline · Alpha Build 24.10.2026</text>
  </g>

  <!-- Phasenleiste -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect x="24" y="102" width="184" height="52" rx="10" fill="none" stroke="none"/>
      <circle cx="46" cy="128" r="11" fill="#1a2e49"/>
      <text x="46" y="132" fill="#9fb5ce" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
      <text x="64" y="124" fill="#8aa2bd" font-size="12.5">Setup</text>
      <text x="64" y="140" fill="#5e748e" font-size="9.5">FC · Hardware · Profil</text>
    </g>
    <g>
      <rect x="216" y="102" width="184" height="52" rx="10" fill="url(#tactive)" stroke="#315c88"/>
      <circle cx="238" cy="128" r="11" fill="#37bdf8"/>
      <text x="238" y="132" fill="#04121f" font-size="10.5" font-weight="800" text-anchor="middle">2</text>
      <text x="256" y="124" fill="#ecf6ff" font-size="12.5" font-weight="600">Filter</text>
      <text x="256" y="140" fill="#9bb4ce" font-size="9.5">Log · Spektrum · Auto</text>
    </g>
    <g>
      <circle cx="430" cy="128" r="11" fill="#1a2e49"/>
      <text x="430" y="132" fill="#9fb5ce" font-size="10.5" font-weight="700" text-anchor="middle">3</text>
      <text x="448" y="124" fill="#8aa2bd" font-size="12.5">P/D neutral</text>
      <text x="448" y="140" fill="#5e748e" font-size="9.5">Tracking · Pitch:Roll</text>
    </g>
    <g>
      <circle cx="622" cy="128" r="11" fill="#1a2e49"/>
      <text x="622" y="132" fill="#9fb5ce" font-size="10.5" font-weight="700" text-anchor="middle">4</text>
      <text x="640" y="124" fill="#8aa2bd" font-size="12.5">Master ζ</text>
      <text x="640" y="140" fill="#5e748e" font-size="9.5">Stufen · Thermik</text>
    </g>
    <g>
      <circle cx="814" cy="128" r="11" fill="#1a2e49"/>
      <text x="814" y="132" fill="#9fb5ce" font-size="10.5" font-weight="700" text-anchor="middle">5</text>
      <text x="832" y="124" fill="#8aa2bd" font-size="12.5">FF / I / D-Max</text>
      <text x="832" y="140" fill="#5e748e" font-size="9.5">Finish · CLI</text>
    </g>
    <g>
      <circle cx="1006" cy="128" r="11" fill="#1a2e49"/>
      <text x="1006" y="132" fill="#9fb5ce" font-size="10.5" font-weight="700" text-anchor="middle">6</text>
      <text x="1024" y="124" fill="#8aa2bd" font-size="12.5">Archiv</text>
      <text x="1024" y="140" fill="#5e748e" font-size="9.5">Logs · Download · Reset</text>
    </g>
    <path d="M24 168h1152" stroke="#223653" stroke-width="1"/>
  </g>

  <!-- Prüf-Gates -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="24" y="184" width="1152" height="78" rx="14" fill="url(#tcard)" stroke="#223653"/>
    <text x="44" y="206" fill="#37bdf8" font-size="8.5" letter-spacing="1.3" font-weight="700">PRÜF-GATES</text>
    <g>
      <rect x="44" y="216" width="268" height="30" rx="8" fill="#50e3a4" fill-opacity="0.09" stroke="#50e3a4" stroke-opacity="0.38"/>
      <circle cx="60" cy="231" r="3.6" fill="#50e3a4"/>
      <text x="72" y="235" fill="#d3e6f7" font-size="10.5">diff all-Backup gesichert</text>
    </g>
    <g>
      <rect x="324" y="216" width="268" height="30" rx="8" fill="#50e3a4" fill-opacity="0.09" stroke="#50e3a4" stroke-opacity="0.38"/>
      <circle cx="340" cy="231" r="3.6" fill="#50e3a4"/>
      <text x="352" y="235" fill="#d3e6f7" font-size="10.5">Betaflight 4.5+ erkannt</text>
    </g>
    <g>
      <rect x="604" y="216" width="268" height="30" rx="8" fill="#50e3a4" fill-opacity="0.09" stroke="#50e3a4" stroke-opacity="0.38"/>
      <circle cx="620" cy="231" r="3.6" fill="#50e3a4"/>
      <text x="632" y="235" fill="#d3e6f7" font-size="10.5">Zielprofil 2 geschützt</text>
    </g>
    <g>
      <rect x="884" y="216" width="268" height="30" rx="8" fill="#f7b955" fill-opacity="0.10" stroke="#f7b955" stroke-opacity="0.42"/>
      <circle cx="900" cy="231" r="3.6" fill="#f7b955"/>
      <text x="912" y="235" fill="#f4dfb6" font-size="10.5">Filterlog prüfen</text>
    </g>
  </g>

  <!-- Spektrum -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="24" y="278" width="700" height="334" rx="14" fill="url(#tcard)" stroke="#223653"/>
    <text x="44" y="306" fill="#ecf6ff" font-size="14.5" font-weight="700">Blackbox-Filterlog</text>
    <text x="44" y="324" fill="#8aa2bd" font-size="9.5">Gyro-Spektrum · Motor-Notch hervorgehoben</text>
    <g font-size="9" fill="#8aa2bd" text-anchor="end">
      <circle cx="608" cy="302" r="3" fill="#37bdf8"/><text x="618" y="305" text-anchor="start">Roh</text>
      <circle cx="664" cy="302" r="3" fill="#23d3d3"/><text x="674" y="305" text-anchor="start">gefiltert</text>
    </g>

    <g stroke="#1b2c45" stroke-width="1">
      <path d="M44 512h660M44 469h660M44 426h660M44 383h660"/>
      <path d="M44 340h660" stroke-opacity="0.6"/>
    </g>

    <rect x="152" y="340" width="110" height="172" fill="#23d3d3" fill-opacity="0.06" stroke="#23d3d3" stroke-opacity="0.30" stroke-dasharray="4 4"/>
    <text x="207" y="356" fill="#7fe3e3" font-size="8.5" letter-spacing="0.9" text-anchor="middle">MOTOR</text>

    <path d="M44 512 C 100 505 120 389 168 380 C 208 373 227 498 267 501 C 301 504 326 428 377 422 C 419 417 444 497 490 501 C 527 504 546 450 591 446 C 628 443 653 499 704 503 L 704 512 Z" fill="url(#tfill)"/>
    <path d="M44 512 C 100 505 120 389 168 380 C 208 373 227 498 267 501 C 301 504 326 428 377 422 C 419 417 444 497 490 501 C 527 504 546 450 591 446 C 628 443 653 499 704 503" fill="none" stroke="#37bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M44 506 C 110 500 140 424 180 416 C 214 409 230 492 268 496 C 306 500 330 452 378 447 C 420 443 446 492 492 496 C 528 499 552 470 594 467 C 630 465 658 497 704 500" fill="none" stroke="#23d3d3" stroke-width="1.6" stroke-opacity="0.8"/>

    <text x="700" y="356" fill="#7fe3e3" font-size="9" text-anchor="end">−42 dB</text>
    <g font-size="8.5" fill="#5e748e">
      <text x="44" y="526">0 Hz</text>
      <text x="374" y="526" text-anchor="middle">1 kHz</text>
      <text x="704" y="526" text-anchor="end">2 kHz</text>
    </g>
    <text x="44" y="596" fill="#5e748e" font-size="9">Diagnostik · kein CLI-Eingriff</text>
  </g>

  <!-- Filter-Slider -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="744" y="278" width="432" height="334" rx="14" fill="url(#tcard)" stroke="#223653"/>
    <text x="764" y="306" fill="#ecf6ff" font-size="14.5" font-weight="700">Filter-Slider</text>
    <text x="764" y="324" fill="#8aa2bd" font-size="9.5">Auto → manuell übersteuerbar</text>

    <g font-size="10.5">
      <text x="764" y="374" fill="#a9bad0">Gyro LPF1</text>
      <text x="1156" y="374" fill="#ecf6ff" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">300 Hz</text>
      <rect x="764" y="384" width="392" height="6" rx="3" fill="#16283f"/>
      <rect x="764" y="384" width="236" height="6" rx="3" fill="#37bdf8"/>
      <circle cx="1000" cy="387" r="7" fill="#07111f" stroke="#37bdf8" stroke-width="2"/>

      <text x="764" y="434" fill="#a9bad0">D-Term LPF1</text>
      <text x="1156" y="434" fill="#ecf6ff" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">150 Hz</text>
      <rect x="764" y="444" width="392" height="6" rx="3" fill="#16283f"/>
      <rect x="764" y="444" width="128" height="6" rx="3" fill="#23d3d3"/>
      <circle cx="892" cy="447" r="7" fill="#07111f" stroke="#23d3d3" stroke-width="2"/>

      <text x="764" y="494" fill="#a9bad0">RPM-Filter</text>
      <text x="1156" y="494" fill="#50e3a4" text-anchor="end" font-size="10">AN</text>
      <rect x="764" y="504" width="392" height="6" rx="3" fill="#16283f"/>
      <rect x="764" y="504" width="392" height="6" rx="3" fill="#50e3a4" fill-opacity="0.7"/>
      <circle cx="1156" cy="507" r="7" fill="#07111f" stroke="#50e3a4" stroke-width="2"/>
    </g>

    <path d="M764 546h392" stroke="#223653"/>
    <text x="764" y="570" fill="#5e748e" font-size="9">Werte folgen dem Log, nicht dem Preset</text>
    <rect x="870" y="580" width="180" height="28" rx="8" fill="#0e1b2e" stroke="#2d4a70"/>
    <text x="960" y="598" fill="#a9bad0" font-size="10" text-anchor="middle">Auto-Vorschlag</text>
  </g>

  <!-- CLI-Plan -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="24" y="628" width="1152" height="88" rx="14" fill="url(#tcard)" stroke="#223653"/>
    <text x="44" y="650" fill="#37bdf8" font-size="8.5" letter-spacing="1.3" font-weight="700">CLI-PLAN · FILTER + PRE-TUNE</text>
    <rect x="1088" y="638" width="70" height="24" rx="7" fill="#0e1b2e" stroke="#2d4a70"/>
    <text x="1123" y="654" fill="#a9bad0" font-size="9.5" text-anchor="middle">kopieren</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#a9d8f5">
      <text x="44" y="674">set gyro_lpf1_static_hz = 300</text>
      <text x="352" y="674">set dterm_lpf1_static_hz = 150</text>
      <text x="660" y="674">set simplified_gyro_filter = ON</text>
      <text x="44" y="696">set simplified_dterm_filter = ON</text>
      <text x="352" y="696">set rpm_filter_harmonics = 3</text>
      <text x="660" y="696" fill="#5e748e">→ Profil 2 · nur sichtbare Änderungen</text>
    </g>
  </g>

  <text x="24" y="742" fill="#5e748e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9">FlowState Tuner · v4.8-alpha.1 · Alpha Build</text>
  <text x="1176" y="742" fill="#5e748e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="end">Ein Projekt von YngwierFPV</text>
</svg>
