<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Schematische Darstellung des FlowState Tuner: Phasenleiste, Log-Kurven und CLI-Plan">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c151d"/>
      <stop offset="1" stop-color="#080e14"/>
    </linearGradient>
    <linearGradient id="tcurve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46e3bd"/>
      <stop offset="1" stop-color="#6aa9ff"/>
    </linearGradient>
    <linearGradient id="tfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46e3bd" stop-opacity=".22"/>
      <stop offset="1" stop-color="#46e3bd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#tbg)"/>
  <g stroke="#16222c" stroke-width="1">
    <path d="M0 120h1200M0 260h1200M0 400h1200M0 540h1200M0 680h1200"/>
  </g>

  <g>
    <rect x="48" y="48" width="1104" height="664" rx="18" fill="#0d151d" stroke="#1d2b36"/>
    <path d="M48 100h1104" stroke="#1d2b36"/>
    <circle cx="76" cy="74" r="5" fill="#46e3bd"/>
    <circle cx="94" cy="74" r="5" fill="#22313d"/>
    <circle cx="112" cy="74" r="5" fill="#22313d"/>
    <text x="140" y="79" fill="#5d7285" font-family="monospace" font-size="14">FlowState Tuner · v4.8-alpha.1</text>
    <rect x="1010" y="62" width="120" height="26" rx="13" fill="#132029" stroke="#254038"/>
    <text x="1070" y="80" fill="#46e3bd" font-family="monospace" font-size="12" text-anchor="middle">verbunden</text>
  </g>

  <g>
    <rect x="72" y="128" width="196" height="560" rx="12" fill="#0a1219" stroke="#1a2833"/>
    <g font-family="monospace" font-size="12" fill="#64798a">
      <text x="92" y="158">PHASEN</text>
    </g>
    <g>
      <rect x="88" y="176" width="164" height="62" rx="9" fill="#10241f" stroke="#2b5a4b"/>
      <circle cx="108" cy="198" r="9" fill="#46e3bd"/>
      <text x="108" y="202" fill="#06231c" font-family="monospace" font-size="10" text-anchor="middle">1</text>
      <text x="126" y="201" fill="#d6e6ee" font-family="sans-serif" font-size="13">Setup</text>
      <text x="106" y="220" fill="#5d7285" font-family="sans-serif" font-size="10">FC · Profil · Backup</text>
    </g>
    <g font-family="sans-serif" font-size="12" fill="#7d8f9d">
      <circle cx="108" cy="262" r="7" fill="none" stroke="#26343f" stroke-width="2"/>
      <text x="126" y="266">Filter</text>
      <circle cx="108" cy="316" r="7" fill="none" stroke="#26343f" stroke-width="2"/>
      <text x="126" y="320">P/D neutral</text>
      <circle cx="108" cy="370" r="7" fill="none" stroke="#26343f" stroke-width="2"/>
      <text x="126" y="374">Master</text>
      <circle cx="108" cy="424" r="7" fill="none" stroke="#26343f" stroke-width="2"/>
      <text x="126" y="428">FF / I / D-Max</text>
      <circle cx="108" cy="478" r="7" fill="none" stroke="#26343f" stroke-width="2"/>
      <text x="126" y="482">Archiv</text>
    </g>
    <path d="M108 244v14M108 298v14M108 352v14M108 406v14M108 460v14" stroke="#26343f" stroke-width="2" stroke-dasharray="3 4"/>
    <rect x="88" y="560" width="164" height="52" rx="9" fill="#0f1a22" stroke="#22323d"/>
    <text x="170" y="582" fill="#8ea3b1" font-family="monospace" font-size="10" text-anchor="middle">BACKUP</text>
    <text x="170" y="600" fill="#46e3bd" font-family="monospace" font-size="11" text-anchor="middle">diff all · ok</text>
  </g>

  <g>
    <rect x="292" y="128" width="520" height="272" rx="12" fill="#0a1219" stroke="#1a2833"/>
    <text x="312" y="156" fill="#64798a" font-family="monospace" font-size="12">GYRO-SPEKTRUM</text>
    <text x="792" y="156" fill="#46e3bd" font-family="monospace" font-size="12" text-anchor="end">−42 dB</text>
    <path d="M312 350h480" stroke="#1c2a35"/>
    <path d="M312 200h480M312 250h480M312 300h480" stroke="#131f28"/>
    <path d="M312 352 C 352 352 366 226 400 216 C 428 208 442 344 470 348 C 494 351 512 268 548 262 C 578 257 596 344 628 348 C 654 351 668 300 700 296 C 726 292 744 346 780 350 L 792 350 L 792 360 L 312 360 Z" fill="url(#tfill)"/>
    <path d="M312 352 C 352 352 366 226 400 216 C 428 208 442 344 470 348 C 494 351 512 268 548 262 C 578 257 596 344 628 348 C 654 351 668 300 700 296 C 726 292 744 346 780 350" fill="none" stroke="url(#tcurve)" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="392" y="196" width="70" height="164" rx="6" fill="#46e3bd" fill-opacity=".06" stroke="#2b5a4b" stroke-dasharray="4 4"/>
    <text x="427" y="184" fill="#5d7285" font-family="monospace" font-size="10" text-anchor="middle">MOTOR</text>
    <g font-family="monospace" font-size="10" fill="#46596a">
      <text x="312" y="378">0 Hz</text>
      <text x="612" y="378">1 kHz</text>
      <text x="740" y="378">2 kHz</text>
    </g>
  </g>

  <g>
    <rect x="292" y="420" width="520" height="268" rx="12" fill="#0a1219" stroke="#1a2833"/>
    <text x="312" y="448" fill="#64798a" font-family="monospace" font-size="12">CLI-PLAN</text>
    <rect x="704" y="432" width="88" height="24" rx="6" fill="#132029" stroke="#254038"/>
    <text x="748" y="449" fill="#46e3bd" font-family="monospace" font-size="11" text-anchor="middle">kopieren</text>
    <g font-family="monospace" font-size="12.5">
      <text x="312" y="482" fill="#46e3bd">set gyro_lpf1_static_hz = 300</text>
      <text x="312" y="510" fill="#8ea3b1">set dterm_lpf1_static_hz = 150</text>
      <text x="312" y="538" fill="#8ea3b1">set simplified_gyro_filter = ON</text>
      <text x="312" y="566" fill="#8ea3b1">set simplified_dterm_filter = ON</text>
      <text x="312" y="594" fill="#8ea3b1">set p_pitch = 48</text>
      <text x="312" y="622" fill="#8ea3b1">set d_pitch = 38</text>
      <text x="312" y="650" fill="#46596a">set i_pitch = 96</text>
    </g>
    <rect x="312" y="662" width="480" height="1" fill="#1c2a35"/>
    <text x="792" y="678" fill="#46596a" font-family="monospace" font-size="10" text-anchor="end">Profil 1 · nur sichtbare Änderungen</text>
  </g>

  <g>
    <rect x="832" y="128" width="320" height="560" rx="12" fill="#0a1219" stroke="#1a2833"/>
    <text x="852" y="156" fill="#64798a" font-family="monospace" font-size="12">GATES</text>
    <g font-family="sans-serif" font-size="12">
      <g>
        <rect x="852" y="174" width="280" height="44" rx="8" fill="#10241f" stroke="#2b5a4b"/>
        <circle cx="872" cy="196" r="4" fill="#46e3bd"/>
        <text x="886" y="200" fill="#c3d6df">Backup vorhanden</text>
      </g>
      <g>
        <rect x="852" y="228" width="280" height="44" rx="8" fill="#10241f" stroke="#2b5a4b"/>
        <circle cx="872" cy="250" r="4" fill="#46e3bd"/>
        <text x="886" y="254" fill="#c3d6df">Firmware 4.5+</text>
      </g>
      <g>
        <rect x="852" y="282" width="280" height="44" rx="8" fill="#10241f" stroke="#2b5a4b"/>
        <circle cx="872" cy="304" r="4" fill="#46e3bd"/>
        <text x="886" y="308" fill="#c3d6df">Zielprofil gewählt</text>
      </g>
      <g>
        <rect x="852" y="336" width="280" height="44" rx="8" fill="#1f1a0d" stroke="#4a3a1a"/>
        <circle cx="872" cy="358" r="4" fill="#f5b954"/>
        <text x="886" y="362" fill="#e0cfa8">Filterlog prüfen</text>
      </g>
    </g>
    <text x="852" y="418" fill="#64798a" font-family="monospace" font-size="12">EXPORT</text>
    <g font-family="monospace" font-size="11.5" fill="#7d8f9d">
      <text x="852" y="444">Plan .txt</text>
      <text x="852" y="468">Manifest .json</text>
      <text x="852" y="492">Roh-Logs .zip</text>
      <text x="852" y="516">Blackbox .bbl</text>
    </g>
    <rect x="852" y="548" width="280" height="76" rx="9" fill="#0f1a22" stroke="#22323d"/>
    <text x="868" y="574" fill="#5d7285" font-family="sans-serif" font-size="11">Zustand</text>
    <text x="868" y="598" fill="#46e3bd" font-family="monospace" font-size="13">lokal · offline</text>
  </g>
</svg>
