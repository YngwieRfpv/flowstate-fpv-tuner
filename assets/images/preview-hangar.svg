<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Ansicht von HangarDeck Lite: Kopf mit Farbreihen, Sprachwahl und Copter-Zähler, darunter die Copter-Liste mit Größe, Zellen, KV, ESC, Props und Status">
  <defs>
    <linearGradient id="hl-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0b3d45"/>
      <stop offset="1" stop-color="#06232a"/>
    </linearGradient>
    <linearGradient id="hl-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd0ae"/>
      <stop offset="1" stop-color="#1e746b"/>
    </linearGradient>
    <linearGradient id="hl-btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35b795"/>
      <stop offset="1" stop-color="#1e746b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#hl-bg)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <!-- Kopfzeile -->
    <rect x="16" y="16" width="1168" height="86" rx="16" fill="#093840" stroke="#155b5b"/>
    <rect x="32" y="33" width="46" height="46" rx="13" fill="url(#hl-mark)"/>
    <path d="M45 62h6l4-12 5 17 4-13h6" fill="none" stroke="#03201b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="52" fill="#e7f6f2" font-size="19" font-weight="700" letter-spacing="-0.3">HangarDeck Lite</text>
    <text x="92" y="74" fill="#94c4b9" font-size="11.5">Copter-Verwaltung · lokal im Browser</text>

    <!-- Farbwahl als drei Streifen -->
    <g>
      <rect x="642" y="38" width="66" height="30" rx="9" fill="#0c4048" stroke="#2ca387" stroke-width="1.6"/>
      <rect x="652" y="46" width="6" height="14" rx="2" fill="#093840"/>
      <rect x="662" y="46" width="6" height="14" rx="2" fill="#1e746b"/>
      <rect x="672" y="46" width="6" height="14" rx="2" fill="#2ca387"/>
      <rect x="682" y="46" width="6" height="14" rx="2" fill="#258c71"/>
      <rect x="692" y="46" width="6" height="14" rx="2" fill="#155b5b"/>

      <rect x="716" y="38" width="66" height="30" rx="9" fill="#0c4048" stroke="#155b5b"/>
      <rect x="726" y="46" width="6" height="14" rx="2" fill="#c9e0f0"/>
      <rect x="736" y="46" width="6" height="14" rx="2" fill="#f4f6f5"/>
      <rect x="746" y="46" width="6" height="14" rx="2" fill="#c4b69c"/>
      <rect x="756" y="46" width="6" height="14" rx="2" fill="#f0e6cb"/>
      <rect x="766" y="46" width="6" height="14" rx="2" fill="#ecbda9"/>

      <rect x="790" y="38" width="66" height="30" rx="9" fill="#0c4048" stroke="#155b5b"/>
      <rect x="800" y="46" width="6" height="14" rx="2" fill="#140a25"/>
      <rect x="810" y="46" width="6" height="14" rx="2" fill="#5a152a"/>
      <rect x="820" y="46" width="6" height="14" rx="2" fill="#8e1e2c"/>
      <rect x="830" y="46" width="6" height="14" rx="2" fill="#d82828"/>
      <rect x="840" y="46" width="6" height="14" rx="2" fill="#390c2b"/>
    </g>

    <!-- Sprache -->
    <rect x="870" y="38" width="76" height="30" rx="9" fill="#072d34" stroke="#155b5b"/>
    <rect x="874" y="42" width="34" height="22" rx="6" fill="#2ca387"/>
    <text x="891" y="57" fill="#03201b" font-size="11.5" font-weight="700" text-anchor="middle">DE</text>
    <text x="926" y="57" fill="#94c4b9" font-size="11.5" text-anchor="middle">EN</text>

    <!-- Copter anlegen -->
    <rect x="960" y="36" width="132" height="34" rx="10" fill="url(#hl-btn)"/>
    <text x="1026" y="58" fill="#03201b" font-size="12.5" font-weight="700" text-anchor="middle">+ Copter</text>

    <!-- Werkzeugleiste -->
    <rect x="16" y="118" width="360" height="38" rx="10" fill="#072d34" stroke="#155b5b"/>
    <circle cx="40" cy="140" r="6.5" fill="none" stroke="#62968b" stroke-width="1.8"/>
    <path d="m45 145 5 5" stroke="#62968b" stroke-width="1.8" stroke-linecap="round"/>
    <text x="60" y="145" fill="#62968b" font-size="12.5">Suchen …</text>

    <circle cx="404" cy="137" r="15" fill="#0c4048" stroke="#155b5b"/>
    <text x="404" y="142" fill="#4fd0ae" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="428" y="142" fill="#94c4b9" font-size="12.5">Copter in der Liste</text>

    <rect x="936" y="119" width="112" height="36" rx="10" fill="#0c4048" stroke="#155b5b"/>
    <text x="992" y="142" fill="#cdebe3" font-size="12.5" text-anchor="middle">Import</text>
    <rect x="1060" y="119" width="124" height="36" rx="10" fill="#0c4048" stroke="#2ca387"/>
    <text x="1122" y="142" fill="#4fd0ae" font-size="12.5" font-weight="600" text-anchor="middle">Export</text>

    <!-- Tabelle -->
    <rect x="16" y="178" width="1168" height="512" rx="16" fill="#093840" stroke="#155b5b"/>

    <rect x="17" y="179" width="1166" height="44" rx="15" fill="#0c4048"/>
    <rect x="17" y="209" width="1166" height="14" fill="#0c4048"/>
    <g fill="#62968b" font-size="11" letter-spacing="0.6">
      <text x="40" y="206">COPTER</text>
      <text x="404" y="206">GRÖSSE</text>
      <text x="500" y="206">SPANNUNG</text>
      <text x="628" y="206">KV</text>
      <text x="740" y="206">ESC (A)</text>
      <text x="852" y="206">PROPS</text>
      <text x="1000" y="206">STATUS</text>
    </g>
    <path d="M17 223h1166" stroke="#1e746b"/>

    <g font-size="13" fill="#e7f6f2">
      <text x="40" y="262">Fünfzöller Freestyle</text>
      <text x="404" y="262" fill="#cdebe3">5"</text>
      <text x="500" y="262" fill="#cdebe3">6S</text>
      <text x="628" y="262" fill="#cdebe3">1800</text>
      <text x="740" y="262" fill="#cdebe3">50</text>
      <text x="852" y="262" fill="#cdebe3">5.1x4.6x3</text>
    </g>
    <rect x="1000" y="246" width="96" height="24" rx="12" fill="#3fd0a4" fill-opacity="0.14" stroke="#3fd0a4" stroke-opacity="0.45"/>
    <text x="1048" y="263" fill="#3fd0a4" font-size="11.5" text-anchor="middle">Flugbereit</text>
    <path d="M17 282h1166" stroke="#155b5b" stroke-opacity="0.7"/>

    <g font-size="13" fill="#e7f6f2">
      <text x="40" y="322">Cinewhoop 3"</text>
      <text x="404" y="322" fill="#cdebe3">3"</text>
      <text x="500" y="322" fill="#cdebe3">4S</text>
      <text x="628" y="322" fill="#cdebe3">3000</text>
      <text x="740" y="322" fill="#cdebe3">35</text>
      <text x="852" y="322" fill="#cdebe3">3x2x3</text>
    </g>
    <rect x="1000" y="306" width="96" height="24" rx="12" fill="#3fd0a4" fill-opacity="0.14" stroke="#3fd0a4" stroke-opacity="0.45"/>
    <text x="1048" y="323" fill="#3fd0a4" font-size="11.5" text-anchor="middle">Flugbereit</text>
    <path d="M17 342h1166" stroke="#155b5b" stroke-opacity="0.7"/>

    <g font-size="13" fill="#e7f6f2">
      <text x="40" y="382">Tiny Whoop</text>
      <text x="404" y="382" fill="#cdebe3">65 mm</text>
      <text x="500" y="382" fill="#cdebe3">1S</text>
      <text x="628" y="382" fill="#cdebe3">19000</text>
      <text x="740" y="382" fill="#62968b">—</text>
      <text x="852" y="382" fill="#62968b">—</text>
    </g>
    <rect x="1000" y="366" width="96" height="24" rx="12" fill="#f2c46b" fill-opacity="0.14" stroke="#f2c46b" stroke-opacity="0.45"/>
    <text x="1048" y="383" fill="#f2c46b" font-size="11.5" text-anchor="middle">In Arbeit</text>
    <path d="M17 402h1166" stroke="#155b5b" stroke-opacity="0.7"/>

    <g font-size="13" fill="#e7f6f2">
      <text x="40" y="442">Langstrecke 7"</text>
      <text x="404" y="442" fill="#cdebe3">7"</text>
      <text x="500" y="442" fill="#cdebe3">6S</text>
      <text x="628" y="442" fill="#cdebe3">1300</text>
      <text x="740" y="442" fill="#cdebe3">60</text>
      <text x="852" y="442" fill="#cdebe3">7x4.5x3</text>
    </g>
    <rect x="1000" y="426" width="96" height="24" rx="12" fill="#ff7a7a" fill-opacity="0.13" stroke="#ff7a7a" stroke-opacity="0.42"/>
    <text x="1048" y="443" fill="#ff7a7a" font-size="11.5" text-anchor="middle">Defekt</text>

    <!-- Dialogzeile: was ein Eintrag noch kann -->
    <rect x="40" y="486" width="1120" height="88" rx="12" fill="#0c4048" stroke="#155b5b"/>
    <text x="60" y="512" fill="#cdebe3" font-size="12.5" font-weight="600">Mehr Details</text>
    <text x="60" y="534" fill="#94c4b9" font-size="11.5">Flight Controller · Akku (mAh) · Abfluggewicht (g) · Notiz</text>
    <text x="60" y="556" fill="#62968b" font-size="11.5">Name und Größe reichen zum Speichern, alles andere bleibt leer.</text>

    <rect x="700" y="486" width="460" height="88" rx="12" fill="#072d34" stroke="#155b5b"/>
    <text x="720" y="512" fill="#cdebe3" font-size="12.5" font-weight="600">Export</text>
    <rect x="720" y="524" width="86" height="26" rx="8" fill="#0c4048" stroke="#155b5b"/>
    <text x="763" y="541" fill="#4fd0ae" font-size="11.5" text-anchor="middle">PDF</text>
    <rect x="816" y="524" width="86" height="26" rx="8" fill="#0c4048" stroke="#155b5b"/>
    <text x="859" y="541" fill="#4fd0ae" font-size="11.5" text-anchor="middle">CSV</text>
    <rect x="912" y="524" width="86" height="26" rx="8" fill="#0c4048" stroke="#155b5b"/>
    <text x="955" y="541" fill="#4fd0ae" font-size="11.5" text-anchor="middle">Drucken</text>
    <rect x="1008" y="524" width="86" height="26" rx="8" fill="#0c4048" stroke="#155b5b"/>
    <text x="1051" y="541" fill="#4fd0ae" font-size="11.5" text-anchor="middle">JSON</text>

    <text x="40" y="614" fill="#94c4b9" font-size="12">Alles bleibt in diesem Browser. Kein Server, kein Konto.</text>
    <text x="40" y="636" fill="#62968b" font-size="11.5">Für Backup oder Umzug den Export nutzen, für den Abgleich das eigene Repository.</text>

    <!-- Fußzeile -->
    <text x="40" y="722" fill="#62968b" font-size="12">HangarDeck Lite · v0.4.0-beta.2</text>
    <text x="1160" y="722" fill="#62968b" font-size="12" text-anchor="end">Ozean · Leinen · Dunkelrot</text>
  </g>
</svg>
