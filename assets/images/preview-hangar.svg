<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Ansicht von HangarDeck: Seitenleiste mit sechs Bereichen, Kopfzeile, Flottenstatus mit Klassenverteilung, Copterkarten und Bestandsliste">
  <defs>
    <linearGradient id="hsb" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0a1a26"/>
      <stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <linearGradient id="htop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102735"/>
      <stop offset="1" stop-color="#0d1f2c"/>
    </linearGradient>
    <linearGradient id="hnav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12352a"/>
      <stop offset="1" stop-color="#0e2a22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="#07131d"/>

  <!-- Seitenleiste -->
  <g>
    <rect width="260" height="760" fill="url(#hsb)"/>
    <path d="M260 0v760" stroke="#1e3a4d" stroke-width="1"/>

    <text x="24" y="50" fill="#e9f5fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.4">HangarDeck</text>
    <text x="24" y="72" fill="#87a3b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">Copter- &amp; Flight-Controller-Verwaltung</text>
    <rect x="24" y="86" width="118" height="20" rx="10" fill="#3ddc97" fill-opacity="0.13" stroke="#3ddc97" stroke-opacity="0.42"/>
    <text x="83" y="100" fill="#3ddc97" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">v0.1.0-beta.2</text>
    <text x="152" y="100" fill="#5e7d90" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9">lokal · offline</text>

    <!-- Bereiche -->
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">
      <rect x="16" y="140" width="228" height="38" rx="8" fill="url(#hnav)" stroke="#3ddc97" stroke-opacity="0.55"/>
      <rect x="16" y="140" width="3" height="38" rx="1.5" fill="#3ddc97"/>
      <text x="30" y="156" fill="#5e7d90" font-size="8" font-family="ui-monospace, Menlo, Consolas, monospace">1</text>
      <text x="44" y="156" fill="#eafaf2" font-weight="600">Übersicht</text>
      <text x="44" y="170" fill="#87a3b5" font-size="9">Flottenstatus</text>

      <text x="30" y="196" fill="#5e7d90" font-size="8" font-family="ui-monospace, Menlo, Consolas, monospace">2</text>
      <text x="44" y="196" fill="#a9c2d1">Flotte</text>
      <text x="44" y="210" fill="#5e7d90" font-size="9">Copter &amp; Setups</text>

      <text x="30" y="236" fill="#5e7d90" font-size="8" font-family="ui-monospace, Menlo, Consolas, monospace">3</text>
      <text x="44" y="236" fill="#a9c2d1">FC-Bibliothek</text>
      <text x="44" y="250" fill="#5e7d90" font-size="9">Boards &amp; Targets</text>

      <text x="30" y="276" fill="#5e7d90" font-size="8" font-family="ui-monospace, Menlo, Consolas, monospace">4</text>
      <text x="44" y="276" fill="#a9c2d1">FC auslesen</text>
      <text x="44" y="290" fill="#5e7d90" font-size="9">Web-Serial / MSP</text>

      <text x="30" y="316" fill="#5e7d90" font-size="8" font-family="ui-monospace, Menlo, Consolas, monospace">5</text>
      <text x="44" y="316" fill="#a9c2d1">Import</text>
      <text x="44" y="330" fill="#5e7d90" font-size="9">CLI &amp; Diff</text>

      <text x="30" y="356" fill="#5e7d90" font-size="8" font-family="ui-monospace, Menlo, Consolas, monospace">6</text>
      <text x="44" y="356" fill="#a9c2d1">Daten</text>
      <text x="44" y="370" fill="#5e7d90" font-size="9">Export &amp; Regeln</text>
    </g>

    <path d="M16 396h228" stroke="#1e3a4d" stroke-width="1"/>

    <!-- Schnellzugriff -->
    <text x="24" y="420" fill="#5e7d90" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" letter-spacing="1.3">SCHNELLZUGRIFF</text>
    <rect x="16" y="432" width="110" height="30" rx="8" fill="#3ddc97"/>
    <text x="71" y="451" fill="#04241a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+ Copter</text>
    <rect x="134" y="432" width="110" height="30" rx="8" fill="#0d1f2c" stroke="#2b5470"/>
    <text x="189" y="451" fill="#a9c2d1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle">FC auslesen</text>

    <!-- Speicher -->
    <rect x="16" y="660" width="228" height="72" rx="10" fill="#0d1f2c" stroke="#1e3a4d"/>
    <text x="30" y="682" fill="#e9f5fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Lokaler Speicher</text>
    <text x="30" y="700" fill="#87a3b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9">18 KB belegt · 12 Copter · 5 Boards</text>
    <rect x="30" y="711" width="200" height="5" rx="2.5" fill="#12303f"/>
    <rect x="30" y="711" width="34" height="5" rx="2.5" fill="#3ddc97"/>
  </g>

  <!-- Kopfzeile -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="278" y="10" width="904" height="52" rx="14" fill="url(#htop)" stroke="#1e3a4d"/>
    <text x="300" y="41" fill="#e9f5fb" font-size="13" font-weight="600">Übersicht</text>
    <text x="378" y="41" fill="#5e7d90" font-size="10">Flottenstatus</text>

    <rect x="800" y="22" width="110" height="28" rx="8" fill="#0a1a26" stroke="#2b5470"/>
    <text x="855" y="40" fill="#a9c2d1" font-size="9.5" text-anchor="middle">Bericht kopieren</text>

    <rect x="920" y="22" width="98" height="28" rx="8" fill="#3ddc97" fill-opacity="0.09" stroke="#3ddc97" stroke-opacity="0.34"/>
    <circle cx="934" cy="36" r="3" fill="#3ddc97"/>
    <text x="944" y="40" fill="#bdeed8" font-size="9.5">Demodaten</text>

    <rect x="1028" y="22" width="134" height="28" rx="8" fill="#0a1a26" stroke="#2b5470"/>
    <text x="1095" y="40" fill="#a9c2d1" font-size="9.5" text-anchor="middle">Akzent: Grün</text>
  </g>

  <!-- Inhalt -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="278" y="96" fill="#5e7d90" font-size="8.5" letter-spacing="1.3" font-weight="700">FLOTTENSTATUS</text>
    <text x="278" y="124" fill="#e9f5fb" font-size="24" font-weight="700">Überblick</text>
    <text x="278" y="146" fill="#87a3b5" font-size="10.5">Alles, was du über deine Copter und Flight Controller wissen musst.</text>
    <text x="278" y="163" fill="#87a3b5" font-size="10.5">Ohne Cloud, ohne Konto.</text>

    <!-- Klassenverteilung -->
    <rect x="278" y="184" width="438" height="176" rx="12" fill="#0d1f2c" stroke="#1e3a4d"/>
    <text x="296" y="208" fill="#e9f5fb" font-size="12" font-weight="600">Klassenverteilung</text>
    <text x="700" y="208" fill="#5e7d90" font-size="9" text-anchor="end">12 Copter</text>

    <g font-size="9.5" fill="#87a3b5">
      <text x="296" y="234">5 Zoll</text>
      <rect x="386" y="226" width="252" height="10" rx="5" fill="#12303f"/>
      <rect x="386" y="226" width="168" height="10" rx="5" fill="#3ddc97"/>
      <text x="650" y="234" fill="#a9c2d1">6</text>

      <text x="296" y="260">4 Zoll</text>
      <rect x="386" y="252" width="252" height="10" rx="5" fill="#12303f"/>
      <rect x="386" y="252" width="84" height="10" rx="5" fill="#37bdf8"/>
      <text x="650" y="260" fill="#a9c2d1">3</text>

      <text x="296" y="286">≤ 3 Zoll</text>
      <rect x="386" y="278" width="252" height="10" rx="5" fill="#12303f"/>
      <rect x="386" y="278" width="28" height="10" rx="5" fill="#f7b955"/>
      <text x="650" y="286" fill="#a9c2d1">1</text>

      <text x="296" y="312">Whoop</text>
      <rect x="386" y="304" width="252" height="10" rx="5" fill="#12303f"/>
      <rect x="386" y="304" width="56" height="10" rx="5" fill="#b38cff"/>
      <text x="650" y="312" fill="#a9c2d1">2</text>
    </g>
    <path d="M296 328h402" stroke="#1a3345"/>
    <text x="296" y="348" fill="#5e7d90" font-size="9">Wartung fällig: 2 Copter · seit über 60 Tagen kein Flug: 3</text>

    <!-- Aufmerksamkeit -->
    <rect x="732" y="184" width="450" height="176" rx="12" fill="#0d1f2c" stroke="#1e3a4d"/>
    <text x="750" y="208" fill="#e9f5fb" font-size="12" font-weight="600">Aufmerksamkeit</text>
    <text x="1164" y="208" fill="#5e7d90" font-size="9" text-anchor="end">Setup-Hinweise</text>

    <g font-size="9.5">
      <rect x="750" y="220" width="414" height="34" rx="8" fill="#f7b955" fill-opacity="0.08" stroke="#f7b955" stroke-opacity="0.3"/>
      <text x="762" y="235" fill="#f3d9a4">Prop-Zoll passt nicht zur Klasse</text>
      <text x="762" y="248" fill="#87a3b5">5-Zoll-Eintrag mit 4,9 Zoll Props</text>
      <text x="1152" y="241" fill="#f7b955" text-anchor="end">prüfen</text>

      <rect x="750" y="262" width="414" height="34" rx="8" fill="#37bdf8" fill-opacity="0.07" stroke="#37bdf8" stroke-opacity="0.26"/>
      <text x="762" y="277" fill="#bcdff5">KV außerhalb des Erfahrungsbereichs</text>
      <text x="762" y="290" fill="#87a3b5">6S mit 2750 KV bei 3 Zoll</text>
      <text x="1152" y="283" fill="#37bdf8" text-anchor="end">ansehen</text>

      <rect x="750" y="304" width="414" height="34" rx="8" fill="#3ddc97" fill-opacity="0.07" stroke="#3ddc97" stroke-opacity="0.26"/>
      <text x="762" y="319" fill="#bdeed8">Alle Einträge vollständig</text>
      <text x="762" y="332" fill="#87a3b5">Keine offenen Felder in den Stammdaten</text>
    </g>

    <!-- Flotte -->
    <text x="278" y="396" fill="#e9f5fb" font-size="13" font-weight="600">Flotte</text>
    <text x="330" y="396" fill="#5e7d90" font-size="9.5">Copter &amp; Setups</text>
    <text x="1182" y="396" fill="#3ddc97" font-size="9.5" text-anchor="end">alle anzeigen</text>

    <g>
      <rect x="278" y="410" width="288" height="150" rx="12" fill="#0d1f2c" stroke="#1e3a4d"/>
      <text x="296" y="434" fill="#e9f5fb" font-size="12" font-weight="600">Apex 5</text>
      <rect x="466" y="422" width="84" height="18" rx="9" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.38"/>
      <text x="508" y="435" fill="#3ddc97" font-size="8.5" text-anchor="middle">flugbereit</text>
      <g font-size="9.5" fill="#87a3b5">
        <text x="296" y="456">5 Zoll · 6S 1300 mAh</text>
        <text x="296" y="474">SpeedyBee F405 V4 · BF 4.5</text>
        <text x="296" y="492">2207 · 1950 KV · DSHOT600</text>
        <text x="296" y="510">ELRS 2,4 GHz · Analog</text>
      </g>
      <path d="M296 522h252" stroke="#1a3345"/>
      <text x="296" y="542" fill="#5e7d90" font-size="8.5">Letzter Flug: vor 6 Tagen</text>

      <rect x="580" y="410" width="288" height="150" rx="12" fill="#0d1f2c" stroke="#1e3a4d"/>
      <text x="598" y="434" fill="#e9f5fb" font-size="12" font-weight="600">Meteor 75</text>
      <rect x="766" y="422" width="86" height="18" rx="9" fill="#f7b955" fill-opacity="0.12" stroke="#f7b955" stroke-opacity="0.38"/>
      <text x="809" y="435" fill="#f7b955" font-size="8.5" text-anchor="middle">Wartung</text>
      <g font-size="9.5" fill="#87a3b5">
        <text x="598" y="456">Whoop · 1S 450 mAh</text>
        <text x="598" y="474">Matek H743-SLIM · BF 4.5</text>
        <text x="598" y="492">0802 · 22000 KV · DSHOT300</text>
        <text x="598" y="510">ELRS 2,4 GHz · VTX 5,8 GHz</text>
      </g>
      <path d="M598 522h252" stroke="#1a3345"/>
      <text x="598" y="542" fill="#5e7d90" font-size="8.5">Letzte Wartung: vor 74 Tagen</text>

      <rect x="882" y="410" width="300" height="150" rx="12" fill="#0d1f2c" stroke="#1e3a4d"/>
      <text x="900" y="434" fill="#e9f5fb" font-size="12" font-weight="600">Bestand</text>
      <g font-size="9.5" fill="#87a3b5">
        <text x="900" y="456">12 Copter · 5 Flight Controller</text>
        <text x="900" y="474">3 Boards mit Quelle hinterlegt</text>
        <text x="900" y="492">2 Einträge ohne Seriennummer</text>
      </g>
      <rect x="900" y="508" width="130" height="26" rx="8" fill="#0a1a26" stroke="#2b5470"/>
      <text x="965" y="525" fill="#a9c2d1" font-size="9" text-anchor="middle">Tabelle öffnen</text>
      <rect x="1040" y="508" width="124" height="26" rx="8" fill="#0a1a26" stroke="#2b5470"/>
      <text x="1102" y="525" fill="#a9c2d1" font-size="9" text-anchor="middle">CSV laden</text>
    </g>

    <!-- Hinweisstreifen -->
    <rect x="278" y="584" width="904" height="66" rx="12" fill="#102735" stroke="#1e3a4d"/>
    <text x="298" y="608" fill="#e9f5fb" font-size="11" font-weight="600">Prüfregeln statt Freigabe</text>
    <text x="298" y="626" fill="#87a3b5" font-size="9.5">Der Setup-Check vergleicht Vollständigkeit, Prop-Zoll, KV, Wartungs- und Flugabstand.</text>
    <text x="298" y="641" fill="#87a3b5" font-size="9.5">Es sind Erfahrungsbereiche, keine Grenzwerte. Die App gibt nichts frei.</text>
    <rect x="1050" y="602" width="114" height="30" rx="8" fill="#3ddc97"/>
    <text x="1107" y="621" fill="#04241a" font-size="9.5" font-weight="700" text-anchor="middle">Copter anlegen</text>

    <!-- Fußzeile -->
    <text x="278" y="686" fill="#5e7d90" font-size="9">Daten liegen im localStorage dieses Browsers. Kein Sync, keine Konten, keine Telemetrie.</text>
    <text x="278" y="704" fill="#5e7d90" font-size="9">JSON-Export vor Browserwechsel oder Reinigung.</text>
    <rect x="1020" y="672" width="162" height="30" rx="8" fill="#0a1a26" stroke="#2b5470"/>
    <text x="1101" y="691" fill="#a9c2d1" font-size="9.5" text-anchor="middle">JSON exportieren</text>
  </g>
</svg>
